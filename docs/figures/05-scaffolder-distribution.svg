<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
<style>
svg {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2330;
  --dim: #4f5d70;
  --line: #c3ccd8;
  --teal: #008a7c;
  --amber: #b86e0a;
  --sky: #2f78b8;
  --coral: #c23a52;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #121821; --surface: #1b2330; --ink: #e8f6ff; --dim: #9fb3c8; --line: #34445b;
    --teal: #35a89f; --amber: #c4841f; --sky: #4f98d4; --coral: #e0607a;
  }
}
text { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.t-dim { fill: var(--dim); }
.t-s { font-size: 11px; }
.t-l { font-size: 13px; }
.t-b { font-weight: 600; }
.t-h { font-family: var(--display); font-size: 14px; font-weight: 600; }
.t-teal { fill: var(--teal); } .t-amber { fill: var(--amber); } .t-coral { fill: var(--coral); } .t-sky { fill: var(--sky); }
.k-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.k-bg { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.k-plain { fill: var(--bg); stroke: none; }
.k-line { stroke: var(--dim); stroke-width: 1.5; fill: none; }
.k-thin { stroke: var(--line); stroke-width: 1; fill: none; }
.k-dash { stroke: var(--dim); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.k-arrow { fill: var(--dim); }
.k-arrow-teal { fill: var(--teal); } .k-arrow-sky { fill: var(--sky); } .k-arrow-amber { fill: var(--amber); }
.soft-teal { fill: color-mix(in srgb, var(--teal) 18%, var(--surface)); stroke: var(--teal); stroke-width: 1.2; }
.soft-amber { fill: color-mix(in srgb, var(--amber) 18%, var(--surface)); stroke: var(--amber); stroke-width: 1.2; }
.soft-sky { fill: color-mix(in srgb, var(--sky) 18%, var(--surface)); stroke: var(--sky); stroke-width: 1.2; }
.soft-coral { fill: color-mix(in srgb, var(--coral) 16%, var(--surface)); stroke: var(--coral); stroke-width: 1.2; }
.soft-dim { fill: color-mix(in srgb, var(--dim) 14%, var(--surface)); stroke: var(--dim); stroke-width: 1; }
</style>
<rect x="0" y="0" width="1000" height="320" fill="var(--surface)"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow"/>
  </marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-teal"/>
  </marker>
  <marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-sky"/>
  </marker>
</defs>

<text x="20" y="32" class="t-h t-teal">5. Developer Scaffolding &amp; Web Distribution</text>
<text x="20" y="52" class="t-dim t-s">Getting started with npm create, and distributing carts via standalone files or web player.</text>

<!-- Scaffolder Flow -->
<rect x="30" y="75" width="440" height="225" rx="8" class="soft-sky"/>
<text x="50" y="105" class="t-h">npm create @stephenwil/tessera@latest</text>

<rect x="50" y="125" width="400" height="40" rx="4" class="k-box"/>
<text x="65" y="150" class="t-b">&gt; npm create @stephenwil/tessera@latest my-game</text>

<rect x="50" y="175" width="190" height="110" rx="4" class="k-box"/>
<text x="65" y="198" class="t-b">Generated Starter:</text>
<text x="65" y="218" class="t-dim t-s">• tessera.json</text>
<text x="65" y="236" class="t-dim t-s">• src/main.lua</text>
<text x="65" y="254" class="t-dim t-s">• assets/palette.txt</text>
<text x="65" y="272" class="t-dim t-s">• .vscode/settings.json</text>

<rect x="260" y="175" width="190" height="110" rx="4" class="k-box"/>
<text x="275" y="198" class="t-b">Ready Commands:</text>
<text x="275" y="222" class="t-dim t-s">npm run dev</text>
<text x="275" y="244" class="t-dim t-s">npm run pack / check</text>
<text x="275" y="266" class="t-dim t-s">npm run build</text>

<!-- Distribution Box -->
<rect x="510" y="75" width="460" height="225" rx="8" class="soft-amber"/>
<text x="530" y="105" class="t-h">Cart Sharing &amp; Web Console</text>

<rect x="530" y="125" width="420" height="42" rx="4" class="k-box"/>
<text x="545" y="145" class="t-b">1. Standalone Single-File (.html)</text>
<text x="545" y="158" class="t-dim t-s">Distribute on itch.io or USB; plays offline with zero dependencies</text>

<rect x="530" y="175" width="420" height="42" rx="4" class="k-box"/>
<text x="545" y="195" class="t-b">2. Picture Cart (.tess.png)</text>
<text x="545" y="208" class="t-dim t-s">Share image on social media/forums; drag &amp; drop onto any Tessera console</text>

<rect x="530" y="225" width="420" height="60" rx="4" class="k-box"/>
<text x="545" y="245" class="t-b">3. Hosted Web Player (play.yourdomain)</text>
<text x="545" y="260" class="t-dim t-s">Deep link via ?cart=https://.../game.tess</text>
<text x="545" y="274" class="t-dim t-s">Works via CLI or AI agents using @stephenwil/tessera-mcp</text>

</svg>