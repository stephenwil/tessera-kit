<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<style>
svg {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2330;
  --dim: #4f5d70;
  --line: #c3ccd8;
  --teal: #008a7c;
  --amber: #b86e0a;
  --sky: #2f78b8;
  --coral: #c23a52;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #121821; --surface: #1b2330; --ink: #e8f6ff; --dim: #9fb3c8; --line: #34445b;
    --teal: #35a89f; --amber: #c4841f; --sky: #4f98d4; --coral: #e0607a;
  }
}
text { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.t-dim { fill: var(--dim); }
.t-s { font-size: 11px; }
.t-l { font-size: 13px; }
.t-b { font-weight: 600; }
.t-h { font-family: var(--display); font-size: 14px; font-weight: 600; }
.t-teal { fill: var(--teal); } .t-amber { fill: var(--amber); } .t-coral { fill: var(--coral); } .t-sky { fill: var(--sky); }
.k-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.k-bg { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.k-plain { fill: var(--bg); stroke: none; }
.k-line { stroke: var(--dim); stroke-width: 1.5; fill: none; }
.k-thin { stroke: var(--line); stroke-width: 1; fill: none; }
.k-dash { stroke: var(--dim); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.k-arrow { fill: var(--dim); }
.k-arrow-teal { fill: var(--teal); } .k-arrow-sky { fill: var(--sky); } .k-arrow-amber { fill: var(--amber); }
.soft-teal { fill: color-mix(in srgb, var(--teal) 18%, var(--surface)); stroke: var(--teal); stroke-width: 1.2; }
.soft-amber { fill: color-mix(in srgb, var(--amber) 18%, var(--surface)); stroke: var(--amber); stroke-width: 1.2; }
.soft-sky { fill: color-mix(in srgb, var(--sky) 18%, var(--surface)); stroke: var(--sky); stroke-width: 1.2; }
.soft-coral { fill: color-mix(in srgb, var(--coral) 16%, var(--surface)); stroke: var(--coral); stroke-width: 1.2; }
.soft-dim { fill: color-mix(in srgb, var(--dim) 14%, var(--surface)); stroke: var(--dim); stroke-width: 1; }
</style>
<rect x="0" y="0" width="1000" height="340" fill="var(--surface)"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow"/>
  </marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-teal"/>
  </marker>
  <marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-sky"/>
  </marker>
</defs>

<text x="20" y="32" class="t-h t-teal">2. Project Manifest &amp; Assembly Pipeline</text>
<text x="20" y="52" class="t-dim t-s">From source files through tessera.json to the single-cart runtime bundle.</text>

<!-- Sources Group -->
<rect x="30" y="75" width="260" height="240" rx="6" class="k-bg"/>
<text x="45" y="100" class="t-b">mygame/ project files</text>

<rect x="45" y="115" width="230" height="36" rx="4" class="k-box"/>
<text x="55" y="137">tessera.json <tspan class="t-dim t-s">(metadata, models, order)</tspan></text>

<rect x="45" y="158" width="230" height="42" rx="4" class="k-box"/>
<text x="55" y="176">src/**/*.lua</text>
<text x="55" y="192" class="t-dim t-s">player.lua → world.lua → main.lua</text>

<rect x="45" y="207" width="230" height="42" rx="4" class="k-box"/>
<text x="55" y="225">models/*.vox</text>
<text x="55" y="241" class="t-dim t-s">hero.vox, hat.vox, crab.vox</text>

<rect x="45" y="256" width="230" height="46" rx="4" class="k-box"/>
<text x="55" y="274">assets/palette.txt &amp; sfx.txt</text>
<text x="55" y="291" class="t-dim t-s">Named colors (C.sand) &amp; synth waves</text>

<!-- Packager Processing Box -->
<rect x="350" y="95" width="260" height="200" rx="8" class="soft-sky"/>
<text x="480" y="125" class="t-h" text-anchor="middle">tessera pack &amp; export</text>
<text x="370" y="155" class="t-dim t-s">• Concatenates Lua with -- file: banners</text>
<text x="370" y="175" class="t-dim t-s">• Generates SourceMap (.tess.map.json)</text>
<text x="370" y="195" class="t-dim t-s">• Deduplicates &amp; remaps .vox palettes</text>
<text x="370" y="215" class="t-dim t-s">• Strict &#8804; 255 color budget check</text>
<text x="370" y="235" class="t-dim t-s">• Serializes to tessera cart v1 format</text>
<text x="370" y="255" class="t-dim t-s">• Encodes steganographic .tess.png</text>

<!-- Output Deliverables -->
<rect x="670" y="75" width="300" height="240" rx="6" class="k-bg"/>
<text x="685" y="100" class="t-b">dist/ artifacts</text>

<rect x="685" y="115" width="270" height="52" rx="4" class="soft-teal"/>
<text x="700" y="137" class="t-b">dist/mygame.tess</text>
<text x="700" y="155" class="t-dim t-s">Text cart: __meta__, __pal__, __models__, __lua__</text>

<rect x="685" y="175" width="270" height="52" rx="4" class="soft-amber"/>
<text x="700" y="197" class="t-b">dist/mygame.tess.png</text>
<text x="700" y="215" class="t-dim t-s">Picture cart: 256×256 cover art with hidden bytes</text>

<rect x="685" y="235" width="270" height="60" rx="4" class="soft-coral"/>
<text x="700" y="257" class="t-b">dist/mygame.html</text>
<text x="700" y="275" class="t-dim t-s">Standalone single-file runner (Vite inlined)</text>
<text x="700" y="289" class="t-dim t-s">Playable offline / ready for itch.io</text>

<!-- Flow lines -->
<line x1="290" y1="195" x2="348" y2="195" class="k-line" marker-end="url(#ar)"/>
<line x1="610" y1="195" x2="668" y2="195" class="k-line" marker-end="url(#ar-sky)"/>

</svg>