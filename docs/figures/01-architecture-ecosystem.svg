<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
<style>
svg {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2330;
  --dim: #4f5d70;
  --line: #c3ccd8;
  --teal: #008a7c;
  --amber: #b86e0a;
  --sky: #2f78b8;
  --coral: #c23a52;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #121821; --surface: #1b2330; --ink: #e8f6ff; --dim: #9fb3c8; --line: #34445b;
    --teal: #35a89f; --amber: #c4841f; --sky: #4f98d4; --coral: #e0607a;
  }
}
text { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.t-dim { fill: var(--dim); }
.t-s { font-size: 11px; }
.t-l { font-size: 13px; }
.t-b { font-weight: 600; }
.t-h { font-family: var(--display); font-size: 14px; font-weight: 600; }
.t-teal { fill: var(--teal); } .t-amber { fill: var(--amber); } .t-coral { fill: var(--coral); } .t-sky { fill: var(--sky); }
.k-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.k-bg { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.k-plain { fill: var(--bg); stroke: none; }
.k-line { stroke: var(--dim); stroke-width: 1.5; fill: none; }
.k-thin { stroke: var(--line); stroke-width: 1; fill: none; }
.k-dash { stroke: var(--dim); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.k-arrow { fill: var(--dim); }
.k-arrow-teal { fill: var(--teal); } .k-arrow-sky { fill: var(--sky); } .k-arrow-amber { fill: var(--amber); }
.soft-teal { fill: color-mix(in srgb, var(--teal) 18%, var(--surface)); stroke: var(--teal); stroke-width: 1.2; }
.soft-amber { fill: color-mix(in srgb, var(--amber) 18%, var(--surface)); stroke: var(--amber); stroke-width: 1.2; }
.soft-sky { fill: color-mix(in srgb, var(--sky) 18%, var(--surface)); stroke: var(--sky); stroke-width: 1.2; }
.soft-coral { fill: color-mix(in srgb, var(--coral) 16%, var(--surface)); stroke: var(--coral); stroke-width: 1.2; }
.soft-dim { fill: color-mix(in srgb, var(--dim) 14%, var(--surface)); stroke: var(--dim); stroke-width: 1; }
</style>
<rect x="0" y="0" width="1000" height="320" fill="var(--surface)"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow"/>
  </marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-teal"/>
  </marker>
  <marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-sky"/>
  </marker>
</defs>

<text x="20" y="32" class="t-h t-teal">1. Three Repositories &amp; GitHub Packages Ecosystem</text>
<text x="20" y="52" class="t-dim t-s">Clean separation of core engine, public/private developer tooling, and game cart projects.</text>

<!-- tessera-high-res -->
<rect x="30" y="80" width="270" height="200" rx="8" class="soft-teal"/>
<text x="50" y="108" class="t-b t-l">stephenwil/tessera-high-res</text>
<text x="50" y="128" class="t-dim t-s">• 256×256×128 Room Volume</text>
<text x="50" y="146" class="t-dim t-s">• WebGL2 768×432 Raymarcher</text>
<text x="50" y="164" class="t-dim t-s">• wasmoon Lua 5.4 Environment</text>
<text x="50" y="182" class="t-dim t-s">• Frame reuse &amp; brick uploads</text>
<rect x="50" y="210" width="230" height="50" rx="6" class="k-box"/>
<text x="165" y="232" class="t-b" text-anchor="middle">Engine Minified Core</text>
<text x="165" y="248" class="t-dim t-s" text-anchor="middle">dist/engine.js (browser + node)</text>

<!-- tessera-kit -->
<rect x="365" y="80" width="270" height="200" rx="8" class="soft-sky"/>
<text x="385" y="108" class="t-b t-l">stephenwil/tessera-kit</text>
<text x="385" y="128" class="t-dim t-s">• @stephenwil/tessera CLI</text>
<text x="385" y="146" class="t-dim t-s">• .vox parser &amp; palette merger</text>
<text x="385" y="164" class="t-dim t-s">• Live dev server + hot reload</text>
<text x="385" y="182" class="t-dim t-s">• Standalone singlefile exporter</text>
<rect x="385" y="210" width="230" height="50" rx="6" class="k-box"/>
<text x="500" y="232" class="t-b" text-anchor="middle">@stephenwil/create-tessera</text>
<text x="500" y="248" class="t-dim t-s" text-anchor="middle">Starter template scaffolder</text>

<!-- tessera-hatchase -->
<rect x="700" y="80" width="270" height="200" rx="8" class="soft-amber"/>
<text x="720" y="108" class="t-b t-l">stephenwil/tessera-hatchase</text>
<text x="720" y="128" class="t-dim t-s">• Private Game Cart project</text>
<text x="720" y="146" class="t-dim t-s">• models/ (three.js → .vox)</text>
<text x="720" y="164" class="t-dim t-s">• src/ (Lua game &amp; world code)</text>
<text x="720" y="182" class="t-dim t-s">• Rules &amp; gameplay test suite</text>
<rect x="720" y="210" width="230" height="50" rx="6" class="k-box"/>
<text x="835" y="232" class="t-b" text-anchor="middle">Built Cart Artifacts</text>
<text x="835" y="248" class="t-dim t-s" text-anchor="middle">hatchase.tess &amp; hatchase.tess.png</text>

<!-- Connections -->
<line x1="300" y1="235" x2="363" y2="235" class="k-line" marker-end="url(#ar-teal)"/>
<text x="332" y="224" class="t-dim t-s" text-anchor="middle">submodule /</text>
<text x="332" y="246" class="t-dim t-s" text-anchor="middle">bundled core</text>

<line x1="635" y1="180" x2="698" y2="180" class="k-line" marker-end="url(#ar-sky)"/>
<text x="667" y="170" class="t-dim t-s" text-anchor="middle">npm install</text>
<text x="667" y="194" class="t-dim t-s" text-anchor="middle">@stephenwil/*</text>

</svg>