<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
<style>
svg {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2330;
  --dim: #4f5d70;
  --line: #c3ccd8;
  --teal: #008a7c;
  --amber: #b86e0a;
  --sky: #2f78b8;
  --coral: #c23a52;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #121821; --surface: #1b2330; --ink: #e8f6ff; --dim: #9fb3c8; --line: #34445b;
    --teal: #35a89f; --amber: #c4841f; --sky: #4f98d4; --coral: #e0607a;
  }
}
text { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.t-dim { fill: var(--dim); }
.t-s { font-size: 11px; }
.t-l { font-size: 13px; }
.t-b { font-weight: 600; }
.t-h { font-family: var(--display); font-size: 14px; font-weight: 600; }
.t-teal { fill: var(--teal); } .t-amber { fill: var(--amber); } .t-coral { fill: var(--coral); } .t-sky { fill: var(--sky); }
.k-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.k-bg { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.k-plain { fill: var(--bg); stroke: none; }
.k-line { stroke: var(--dim); stroke-width: 1.5; fill: none; }
.k-thin { stroke: var(--line); stroke-width: 1; fill: none; }
.k-dash { stroke: var(--dim); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.k-arrow { fill: var(--dim); }
.k-arrow-teal { fill: var(--teal); } .k-arrow-sky { fill: var(--sky); } .k-arrow-amber { fill: var(--amber); }
.soft-teal { fill: color-mix(in srgb, var(--teal) 18%, var(--surface)); stroke: var(--teal); stroke-width: 1.2; }
.soft-amber { fill: color-mix(in srgb, var(--amber) 18%, var(--surface)); stroke: var(--amber); stroke-width: 1.2; }
.soft-sky { fill: color-mix(in srgb, var(--sky) 18%, var(--surface)); stroke: var(--sky); stroke-width: 1.2; }
.soft-coral { fill: color-mix(in srgb, var(--coral) 16%, var(--surface)); stroke: var(--coral); stroke-width: 1.2; }
.soft-dim { fill: color-mix(in srgb, var(--dim) 14%, var(--surface)); stroke: var(--dim); stroke-width: 1; }
</style>
<rect x="0" y="0" width="1000" height="320" fill="var(--surface)"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow"/>
  </marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-teal"/>
  </marker>
  <marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="k-arrow-sky"/>
  </marker>
</defs>

<text x="20" y="32" class="t-h t-teal">4. Voxel Asset Pipeline: MagicaVoxel / Goxel &amp; Palette</text>
<text x="20" y="52" class="t-dim t-s">Natively converts .vox chunks, multi-frame animations, and unifies palettes into the 255-index limit.</text>

<!-- Input Assets -->
<rect x="30" y="75" width="240" height="225" rx="6" class="k-bg"/>
<text x="45" y="100" class="t-b">Voxel &amp; Palette Assets</text>

<rect x="45" y="115" width="210" height="52" rx="4" class="k-box"/>
<text x="55" y="135" class="t-b">hero.vox</text>
<text x="55" y="153" class="t-dim t-s">28×14×24, 6 frames, pivot [10,6,0]</text>

<rect x="45" y="175" width="210" height="52" rx="4" class="k-box"/>
<text x="55" y="195" class="t-b">hat.vox, crab.vox</text>
<text x="55" y="213" class="t-dim t-s">Static models &amp; step animations</text>

<rect x="45" y="235" width="210" height="52" rx="4" class="k-box"/>
<text x="55" y="255" class="t-b">assets/palette.txt</text>
<text x="55" y="273" class="t-dim t-s">Custom names: C.sand, C.sea, C.sky</text>

<!-- Processing Node -->
<rect x="330" y="75" width="310" height="225" rx="8" class="soft-teal"/>
<text x="485" y="105" class="t-h" text-anchor="middle">Palette &amp; Model Engine</text>

<rect x="345" y="120" width="280" height="42" rx="4" class="k-box"/>
<text x="355" y="139" class="t-b">1. Exact Hex Deduplication</text>
<text x="355" y="153" class="t-dim t-s">Collapses identical #RRGGBB across files</text>

<rect x="345" y="170" width="280" height="42" rx="4" class="k-box"/>
<text x="355" y="189" class="t-b">2. Budget Check (&le; 255 Colors)</text>
<text x="355" y="203" class="t-dim t-s">Slot 0 = Empty. Fails build if count &gt; 255</text>

<rect x="345" y="220" width="280" height="65" rx="4" class="k-box"/>
<text x="355" y="239" class="t-b">3. Index Remap &amp; Animation Pack</text>
<text x="355" y="255" class="t-dim t-s">Remaps model bytes to global index</text>
<text x="355" y="271" class="t-dim t-s">Packs sequential nSHP frames</text>

<!-- Output Cart Section -->
<rect x="700" y="75" width="270" height="225" rx="6" class="k-bg"/>
<text x="715" y="100" class="t-b">Cart __models__ &amp; __pal__</text>

<rect x="715" y="115" width="240" height="80" rx="4" class="k-box"/>
<text x="725" y="137" class="t-b">__pal__</text>
<text x="725" y="155" class="t-dim t-s">1 3a86ff sky_blue</text>
<text x="725" y="171" class="t-dim t-s">2 f6f3ec white_paw</text>
<text x="725" y="187" class="t-dim t-s">3 d4a373 sand</text>

<rect x="715" y="205" width="240" height="80" rx="4" class="k-box"/>
<text x="725" y="227" class="t-b">__models__</text>
<text x="725" y="245" class="t-dim t-s">hero 28x14x24 frames=6 pivot=10,6,0</text>
<text x="725" y="261" class="t-dim t-s">.. 01 01 .. .. (hex voxel grid)</text>
<text x="725" y="277" class="t-dim t-s">frame (separator)</text>

<!-- Connections -->
<line x1="270" y1="185" x2="328" y2="185" class="k-line" marker-end="url(#ar-teal)"/>
<line x1="640" y1="185" x2="698" y2="185" class="k-line" marker-end="url(#ar-teal)"/>

</svg>